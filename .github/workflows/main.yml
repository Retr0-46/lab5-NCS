name: CI

on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -ll -ii -r . -f json -o bandit-report.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-findings
          path: bandit-report.json

  image_scan:
    name: Build and Run Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile -t mytestapp:latest .

      # Docker Scout checks the Docker Hub entitlement of the account it finds
      # in the runner credential store. On a public runner the only credential
      # there is the GitHub token stored under the name "githubactions", and
      # that account has no Docker Scout subscription. Logging in to Docker Hub
      # first gives Scout a real account to check.
      #
      # DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD have to be added as repository
      # secrets. A free Docker Hub account is enough.
      - name: Check Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_PASSWORD }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD are not set as repository secrets."
            echo "Add them in the repository settings, then the image scan can run."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Scout Quickview
        uses: docker/scout-action@v1.15.1
        with:
          image: mytestapp:latest
          command: quickview
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          write-comment: false

      - name: Docker Scout CVE Scan
        uses: docker/scout-action@v1.15.1
        with:
          image: mytestapp:latest
          command: cves
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          only-severities: critical,high
          sarif-file: scout-report.sarif
          write-comment: false
          # Makes the step fail when critical or high CVEs are found.
          exit-code: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-scout-findings
          path: scout-report.sarif

  dast_scan:
    name: DAST with OWASP ZAP
    runs-on: ubuntu-latest

    # The Bandit job fails on purpose, because it finds real issues.
    # Without "if: always()" this job would be skipped when a needed job fails,
    # and the dynamic scan would never run.
    needs: [sast_scan, image_scan]
    if: always()

    services:
      pygoat:
        image: pygoat/pygoat:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd="curl -f http://localhost:8000/ || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for PyGoat to be ready
        run: |
          # PyGoat answers / with a 302 redirect to the login page, so a 200 is
          # never returned here. Any HTTP status below 500 means the app is up.
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "PyGoat is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for PyGoat... ($i)"
            sleep 2
          done
          echo "PyGoat did not start in time"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8000'
          cmd_options: '-a -j'
          allow_issue_writing: false
          artifact_name: zap-scan-report

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md
